[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    "triton==3.5.1",
]

[tool.uv.sources]
torch = [
    { url = "https://download.pytorch.org/whl/torch/torch-2.9.1%2Bcu128-cp312-cp312-manylinux_2_28_x86_64.whl" },
]
